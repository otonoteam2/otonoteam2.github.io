function intro(){stopClock();state.screen='intro';save();screen(`<section class="panel hero"><small>OTONO TEAM • HONG KONG</small><h1>DO NOT <span>MISBEHAVE!</span></h1><div class="pill">THE LANTAU TRIP • DAY ONE</div><p>Today the Otono Team is going to Lantau Island! Their adventure includes Central Ferry Pier, a supermarket, seafood dinner, a 20-minute car journey driven by Big Guy, and a <b>VERY, VERY comfortable</b> air-conditioned holiday house with the legendary E-Gui wardrobe.</p></section><section class="panel"><h2>The 200-mark revolution</h2><div class="dialogue"><b>RED</b>“The 100-mark school system is BORING! Why can't we use TWO HUNDRED?”</div><div class="dialogue"><b>OWING</b>“Misbehaving should normally deduct TEN!”</div><div class="dialogue"><b>RED</b>“No! Small things should be one, two, three or five. Big things should be twenty or twenty-five!”</div><div class="dialogue"><b>UNCLE JOE</b>“FINE. I'll be in charge of this game!”</div><p class="muted">This conversation is part of the story; you don't vote on the 200-mark idea.</p><div class="actions">${btn('How to play →','rules','btnmain')}${readSave()&&readSave().screen!=='intro'?btn('Resume saved game','resume','btnline'):''}</div></section>`);}
function rules(){state.screen='rules';save();screen(`<section class="panel"><div class="pill">BEFORE THE ADVENTURE</div><h2>How to play</h2><div class="steps"><div class="step"><b>1 • Five characters</b><div>Red, Jessica, OWing, Lit and Luke are all playable. Big Guy leads the trip and drives the car. Gary and Ivy help lead. Grandpa Belt, Uncle Joe, Aunt Alice, Chloe and Jason appear as non-playable family members. Uncle Joe is the judge.</div></div><div class="step"><b>2 • One to five human players</b><div>Five human players is the default. Assign each character to a player. If you play solo, you answer EVERY question for all five characters.</div></div><div class="step"><b>3 • Four options, hidden consequences</b><div>Every decision has A, B, C and D choices. Marks are hidden until you choose. All characters get the same number of possible scenes: 4, 5, 6, 5 and 15 across the chapters.</div></div><div class="step"><b>4 • Private turns, shuffled order</b><div>Turns are shuffled! The same person can have two in a row. Pass the device when asked; only the active character’s score is shown. Group scores are revealed after everyone completes a chapter.</div></div><div class="step"><b>5 • Grade or rare DQ</b><div>Start at 200. Marks CAN go below zero. Grade 10 requires exactly 200. Uncle Joe may issue a rare instant DQ for deliberately derailing the journey; other characters continue. Disability, being frightened, accidents or a small appetite are not misbehaviour.</div></div><div class="step"><b>6 • Chapter 4 clock</b><div>The car departs at 20:15. A fast animated 20:00 countdown represents the 20-minute journey, slowing around Red’s second light decision. At 00:00 the group arrives at 20:35.</div></div></div><div class="actions">${btn('Continue to setup →','setup','btnmain')}${btn('Back','intro','btnline')}</div></section>`);}
function setup(){state.screen='setup';save();const opt=n=>`<option value="${n}" ${state.players===n?'selected':''}>${n} player${n>1?'s':''}</option>`;let rows=PEOPLE.map((p,i)=>`<div class="assign"><i class="dot" style="background:${COLORS[state.colorIds[state.owners[i]]].hex}"></i><b>${p}</b><select data-owner="${i}" aria-label="Human player controlling ${p}">${Array.from({length:state.players},(_,n)=>`<option value="${n}" ${state.owners[i]===n?'selected':''}>Player ${n+1} • ${COLORS[state.colorIds[n]].name}</option>`).join('')}</select></div>`).join('');let colorRows=Array.from({length:state.players},(_,i)=>`<div class="assign"><i class="dot" style="background:${COLORS[state.colorIds[i]].hex}"></i><b>Player ${i+1}</b>${i<2?`<span class="small muted">${COLORS[i].name} (fixed)</span>`:`<select data-color="${i}" aria-label="Colour for player ${i+1}">${[2,3,4].map(c=>`<option value="${c}" ${state.colorIds[i]===c?'selected':''}>${COLORS[c].name}</option>`).join('')}</select>`}</div>`).join('');screen(`<section class="panel"><div class="pill">SET UP YOUR GAME</div><h2>Players and difficulty</h2><div class="setupGrid"><label>Number of human players<select id="numPlayers">${[1,2,3,4,5].map(opt).join('')}</select></label><label>Difficulty<select id="mode">${['Easy','Medium','Hard','Insane'].map(m=>`<option ${m===state.mode?'selected':''}>${m}</option>`).join('')}</select></label></div><p class="muted small">Player 1 is always Otono purple <b>#7a2682</b>. Player 2 is always red. Other active player slots use yellow, pink or blue. You may swap those three colours.</p><h3>Player colours</h3>${colorRows}<h3>Who controls each character?</h3>${rows}<p class="muted small">Any human player may control multiple characters. Five characters remain playable in every game.</p><div class="actions">${btn('START THE ADVENTURE','start','btnmain')}${btn('How to play','rules','btnline')}</div></section>`);}

function next(){stopClock();while(state.index<state.queue.length&&state.disqualified[PEOPLE.indexOf(SCENES.find(s=>s.id===state.queue[state.index]).character)])state.index++;if(state.index>=state.queue.length){if(state.chapter===3){arrive();return;}chapterResults();return;}state.current=state.queue[state.index];state.stage='pass';save();passScreen();}
function scene(){return SCENES.find(s=>s.id===state.current);}
function passScreen(){const s=scene(), owner=slot(s.character),c=theme(s.character);let label=state.players===1?'SINGLE PLAYER':`PASS DEVICE TO PLAYER ${owner+1}`;state.stage='pass';save();screen(`<section class="panel hero"><div class="pill">CHAPTER ${state.chapter+1} • PRIVATE TURN</div><h2>${label}</h2><div class="personcard ${c.light?'light':''}" style="--who:${c.hex}"><div class="small">${h(c.name)} PLAYER ${owner+1}</div><h2>YOU ARE NOW ${h(s.character).toUpperCase()}!</h2></div><p>Other characters’ marks are hidden. Only look when you are the active player.</p><div class="actions">${btn('I AM READY →','play','btnmain')}</div></section>`);}
function startCarClock(){if(state.chapter!==3)return;if(!state.carStarted){state.carStarted=true;state.carSeconds=1200;animateClock(780,7500);} }
function animateClock(target,duration){stopClock();let start=state.carSeconds,t0=Date.now();clockTimer=setInterval(()=>{let t=Math.min(1,(Date.now()-t0)/duration);state.carSeconds=Math.max(0,Math.round(start+(target-start)*t));let e=document.getElementById('carClock'),ct=document.getElementById('storyTime'),bar=document.getElementById('carBar');if(e)e.textContent=clockFormat(state.carSeconds);if(ct)ct.textContent=storyTime(state.carSeconds);if(bar)bar.style.width=Math.max(0,state.carSeconds/12)+'%';if(t===1){stopClock();save();}},55);}
function clockFormat(v){return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;}
function storyTime(v){let secs=(20*60-v);let mins=Math.floor(secs/60);return `20:${String(15+mins).padStart(2,'0')}`;}
function carGraphic(){return `<div class="car-stage ${state.light==='on'?'lit':state.light==='soft'?'soft':''}" id="carStage"><svg viewBox="0 0 420 210" role="img" aria-label="Interior of Big Guy's car at night"><path d="M35 140 L70 36 H350 L385 140 Z" fill="#080e20" class="darkwindow" stroke="#776486" stroke-width="5"/><path d="M210 38V137" stroke="#69557d" stroke-width="5"/><path class="beam" d="M210 26 L80 190 H340 Z" fill="#fff3ad" opacity="0"/><rect x="22" y="145" width="165" height="48" rx="16" fill="#33283d"/><rect x="235" y="145" width="165" height="48" rx="16" fill="#33283d"/><circle class="passenger" cx="110" cy="132" r="23" fill="#635063"/><circle class="passenger" cx="315" cy="132" r="23" fill="#635063"/><rect class="lamp" x="193" y="18" width="34" height="13" rx="6" fill="#4b3c58"/></svg></div>`;}
function gameHeader(s){let i=PEOPLE.indexOf(s.character),c=theme(s.character),gr=grade(state.scores[i],state.mode);return `<div class="statline"><span class="pill">CHAPTER ${state.chapter+1} • DECISION ${state.index+1}</span><span class="small muted">${CHAPTERS[state.chapter].time} • ${state.mode.toUpperCase()}</span></div><div class="statline" style="margin-top:14px"><div><div class="small muted">ONLY YOUR SCORE</div><div class="score">${state.scores[i]} / 200</div></div><div class="tag" style="background:${GCOL[gr]};color:#22162a">GRADE ${gr} • ${GNAME[gr]}</div></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,state.scores[i]/2))}%"></i></div>${state.chapter===3?`<div class="clock"><div><div class="small muted">HONG KONG TIME</div><b id="storyTime">${storyTime(state.carSeconds)}</b></div><div style="text-align:right"><div class="small muted">JOURNEY REMAINING</div><div class="count" id="carClock">${clockFormat(state.carSeconds)}</div></div></div><div class="bar"><i id="carBar" style="width:${Math.max(0,state.carSeconds/12)}%"></i></div>${carGraphic()}`:''}<div class="personcard ${c.light?'light':''}" style="--who:${c.hex}"><div class="small">${c.name.toUpperCase()} PLAYER ${slot(s.character)+1}</div><h2>YOU ARE NOW ${h(s.character).toUpperCase()}!</h2><p>${h(s.flair)}</p><p><strong>${h(s.question)}</strong></p></div>`;}
function play(){const s=scene();state.stage='play';state.screen='story';if(state.chapter===3){startCarClock();if(s.id==='3-2-0'){state.carSeconds=720;stopClock();}}save();screen(`<section class="panel">${gameHeader(s)}<h3>What will you do?</h3><div class="answers">${s.choices.map((a,i)=>`<button data-action="choose" data-choice="${i}"><span>${'ABCD'[i]}.</span>${h(a.label)}</button>`).join('')}</div><p class="muted small">Deductions are hidden until you choose. Rare serious actions may lead to DQ.</p></section>`);}
function choose(option){if(state.stage!=='play')return;stopClock();const s=scene(),p=PEOPLE.indexOf(s.character),opt=s.choices[option];if(opt.dq)state.disqualified[p]=true;else state.scores[p]+=opt.delta;state.answered.push({id:s.id,choice:option,delta:opt.delta,dq:!!opt.dq});if(s.id==='3-2-0'){state.redLightAnswered=true;if(option===2||option===3)state.light='on';else if(option===1)state.light='soft';else state.light='off';state.carSeconds=720;}
state.stage='feedback';save();const final=state.scores[p],g=grade(final,state.mode);screen(`<section class="panel">${gameHeader(s)}<div class="event ${opt.dq?'gameNotice':''}"><div class="pill">UNCLE JOE'S RULING</div><h2 class="${opt.dq?'negative':opt.delta?'negative':'good'}">${opt.dq?'INSTANT DISQUALIFICATION':opt.delta?`DEDUCT ${Math.abs(opt.delta)}!`:'NO DEDUCTION'}</h2><p>${h(opt.feedback)}</p>${opt.dq?'<p><b>The adults make sure this character is safe. Only this character is out; everyone else continues.</b></p>':`<p><b>Your updated marks:</b> ${final}/200 • Grade ${g} (${GNAME[g]})</p>`}</div><div class="actions">${btn('Continue →','advance','btnmain')}</div></section>`);}
function advance(){state.index++;state.current=null;save();next();}
function finishCarCountdown(done){stopClock();let start=state.carSeconds, t0=Date.now();let dur=3800;clockTimer=setInterval(()=>{let t=Math.min(1,(Date.now()-t0)/dur);state.carSeconds=Math.round(start*(1-t));let e=document.getElementById('carClock'),st=document.getElementById('storyTime'),b=document.getElementById('carBar');if(e)e.textContent=clockFormat(state.carSeconds);if(st)st.textContent=storyTime(state.carSeconds);if(b)b.style.width=Math.max(0,state.carSeconds/12)+'%';if(t===1){stopClock();save();done();}},50);}
function arrive(){state.stage='arrive';state.screen='story';save();screen(`<section class="panel hero"><div class="pill">CHAPTER 4 • FINAL APPROACH</div><h2>Big Guy drives the last stretch to the house...</h2><div class="clock"><b>HONG KONG TIME</b><b id="storyTime">${storyTime(state.carSeconds)}</b></div><div class="count" id="carClock">${clockFormat(state.carSeconds)}</div><div class="bar"><i id="carBar" style="width:${Math.max(0,state.carSeconds/12)}%"></i></div><p>Arriving at 20:35. Next stop: the powerful air conditioning, the E-Gui and hide-and-seek!</p></section>`);finishCarCountdown(()=>{state.carSeconds=0;state.stage='arrived';save();screen(`<section class="panel hero"><div class="pill">20:35 • LANTAU ISLAND</div><h1 style="font-size:clamp(2rem,6vw,4rem)">00:00</h1><h2>YOU HAVE ARRIVED!</h2><p>The long car journey ends. Everyone enters the comfortable Lantau house. Chapter 5 awaits!</p><div class="actions">${btn('See chapter results →','results','btnmain')}</div></section>`);});}
function chapterResults(){state.stage='results';state.screen='story';save();let rows=PEOPLE.map((p,i)=>({p,i,s:state.scores[i],dq:state.disqualified[i],g:grade(state.scores[i],state.mode)})).sort((a,b)=>a.dq-b.dq||b.s-a.s);screen(`<section class="panel"><div class="pill">ALL ACTIVE CHARACTERS FINISHED</div><h2>Chapter ${state.chapter+1} results</h2><p>Uncle Joe reveals everyone's results now that the private decisions are complete.</p><div class="leader">${rows.map((r,k)=>{let c=theme(r.p);return `<div class="leadrow ${r.g===10&&!r.dq?'grade10':''}"><b>${k+1}</b><i class="dot" style="background:${c.hex}"></i><b>${r.p}</b><span class="score small">${r.dq?'—':r.s+'/200'}</span><span class="tag ${r.dq?'dq':''}" style="${r.dq?'':`background:${GCOL[r.g]};color:#23192b`}">${r.dq?'DQ':`G${r.g} ${GNAME[r.g]}`}</span></div>`;}).join('')}</div><p class="small muted">Disqualified characters remain safely with the family, but cannot earn another grade.</p><div class="actions">${btn(state.chapter===4?'See final ceremony →':'Continue to next chapter →','afterResults','btnmain')}</div></section>`);}
function afterResults(){if(state.chapter===4){finale();return;}state.chapter++;makeQueue();chapterIntro();}
function finale(){state.screen='final';state.stage='final';save();let rows=PEOPLE.map((p,i)=>({p,i,s:state.scores[i],dq:state.disqualified[i],g:grade(state.scores[i],state.mode)})).sort((a,b)=>a.dq-b.dq||b.s-a.s);screen(`<section class="panel hero"><div class="pill">LANTAU • 20:35 ONWARDS</div><h1 style="font-size:clamp(2rem,5vw,3.7rem)">FINAL GRADES!</h1><p>After the seafood dinner, the car-light argument, strong air conditioning and all those E-Gui hide-and-seek rounds, Uncle Joe delivers the final verdict!</p></section><section class="panel"><div class="leader">${rows.map((r,k)=>{let c=theme(r.p);return `<div class="leadrow ${r.g===10&&!r.dq?'grade10':''}"><b>${k+1}</b><i class="dot" style="background:${c.hex}"></i><b>${r.p}</b><span class="score small">${r.dq?'—':r.s+'/200'}</span><span class="tag ${r.dq?'dq':''}" style="${r.dq?'':`background:${GCOL[r.g]};color:#23192b`}">${r.dq?'DQ':`G${r.g} ${GNAME[r.g]}`}</span></div>`;}).join('')}</div><div class="dialogue" style="margin-top:20px"><b>UNCLE JOE</b>“THE FINAL RESULTS ARE OFFICIAL!”</div><p class="muted">A score below zero remains below zero. A DQ is not Grade U. Each character receives an individual result.</p><div class="actions">${btn('Play again','restart','btnmain')}${btn('Return to main menu','home','btnline')}</div></section>`);}
function confirmLeave(){if(['story','final'].includes(state.screen)){return confirm('Return to index.html? Your game is saved on this device.');}return true;}
document.querySelector('#menuLink').addEventListener('click',e=>{if(!confirmLeave())e.preventDefault();});
document.addEventListener('change',e=>{if(e.target.id==='numPlayers')assignCount(Number(e.target.value));if(e.target.id==='mode'){state.mode=e.target.value;save();}if(e.target.dataset.owner!==undefined){state.owners[Number(e.target.dataset.owner)]=Number(e.target.value);setup();}if(e.target.dataset.color!==undefined){setColor(Number(e.target.dataset.color),Number(e.target.value));}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let act=b.dataset.action;switch(act){case'intro':intro();break;case'rules':rules();break;case'setup':setup();break;case'start':start();break;case'next':next();break;case'play':play();break;case'choose':choose(Number(b.dataset.choice));break;case'advance':advance();break;case'results':chapterResults();break;case'afterResults':afterResults();break;case'restart':state={...structuredClone(defaults)};setup();break;case'home':if(confirmLeave())location.href='index.html';break;case'resume':{let old=readSave();if(old){state=old;restore();}break;}}});
function restore(){stopClock();if(state.screen==='rules')rules();else if(state.screen==='setup')setup();else if(state.screen==='final')finale();else if(state.screen==='story'){if(state.stage==='introChapter')chapterIntro();else if(state.stage==='pass')passScreen();else if(state.stage==='play')play();else if(state.stage==='feedback'){// Repeat feedback without reapplying any deduction.
let last=state.answered[state.answered.length-1],s=SCENES.find(x=>x.id===last.id);if(s){state.current=s.id;let o=s.choices[last.choice];let p=PEOPLE.indexOf(s.character);let g=grade(state.scores[p],state.mode);screen(`<section class="panel">${gameHeader(s)}<div class="event"><h2>${o.dq?'DISQUALIFIED':o.delta?`DEDUCT ${Math.abs(o.delta)}!`:'NO DEDUCTION'}</h2><p>${h(o.feedback)}</p>${o.dq?'':`<p>Your updated marks: ${state.scores[p]}/200 • Grade ${g}</p>`}</div><div class="actions">${btn('Continue →','advance','btnmain')}</div></section>`);}else next();}else if(state.stage==='results')chapterResults();else if(state.stage==='arrive'||state.stage==='arrived')arrive();else next();}else intro();}
intro();
</script></body></html>
